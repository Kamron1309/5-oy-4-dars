<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enhanced To-Do List</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 min-h-screen py-8">
    <div class="max-w-2xl mx-auto px-4">
        <h1 class="text-3xl font-bold text-center text-gray-800 mb-8">Enhanced To-Do List</h1>
        
        <!-- Add Task Form -->
        <div class="flex gap-2 mb-6">
            <input 
                type="text" 
                id="new-task-input" 
                placeholder="Add a new task..." 
                class="flex-grow px-4 py-2 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500"
            >
            <button 
                id="add-task-btn" 
                class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors"
            >
                <i class="fas fa-plus mr-2"></i>Junatish
            </button>
        </div>
        
        <!-- Tasks Sections -->
        <div class="space-y-6">
            <!-- To-Do Tasks -->
            <div class="bg-white rounded-lg shadow p-6">
                <h2 class="text-xl font-semibold text-gray-800 border-b pb-2 mb-4">
                    Tasks to do - <span id="todo-count" class="text-gray-500">0</span>
                </h2>
                <div id="todo-tasks" class="space-y-3"></div>
            </div>
            
            <!-- Done Tasks -->
            <div class="bg-white rounded-lg shadow p-6">
                <h2 class="text-xl font-semibold text-gray-800 border-b pb-2 mb-4">
                    Done - <span id="done-count" class="text-gray-500">0</span>
                </h2>
                <div id="done-tasks" class="space-y-3"></div>
            </div>
        </div>
    </div>

    <script src="./app.js"></script>
</body>
</html>
